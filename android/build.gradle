buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // react-native-inappbrowser-reborn defaults to dynamic versions (1.5.+/1.4.+),
        // which makes every build request Maven metadata. Keep dependency resolution
        // reproducible and avoid unnecessary network lookups.
        androidXAnnotationVersion = "1.5.0"
        androidXBrowserVersion = "1.4.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.3")

    }
}

allprojects {
    repositories {
        maven {
            url("$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
        google()
        mavenCentral()
    }
}

apply plugin: "com.facebook.react.rootproject"
