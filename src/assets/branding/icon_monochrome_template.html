<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QueueLess Premium Monochrome App Icon</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .icon-container {
      width: 512px;
      height: 512px;
      background-color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-svg {
      width: 325px;
      height: 325px;
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <svg class="logo-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Location Pin Outer Shape (Q Body) -->
      <path
        d="M 256 82 C 335.36 82, 399.36 145.92, 399.36 225.28 C 399.36 304.64, 256 419.84, 256 419.84 C 256 419.84, 112.64 304.64, 112.64 225.28 C 112.64 145.92, 176.64 82, 256 82 Z"
        stroke="#000000"
        stroke-width="30"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      
      <!-- Q Tail -->
      <path
        d="M 348.16 327.68 C 378.88 358.4, 399.36 389.12, 430.08 409.6"
        stroke="#000000"
        stroke-width="30"
        stroke-linecap="round"
      />
      
      <!-- Heartbeat pulse wave -->
      <path
        d="M 163.84 225.28 H 215.04 L 235.52 163.84 L 256 286.72 L 276.48 225.28 H 348.16"
        stroke="#000000"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Vertical bar of Medical Cross intersecting the heartbeat -->
      <path
        d="M 256 174.08 V 276.48"
        stroke="#000000"
        stroke-width="26"
        stroke-linecap="round"
      />
    </svg>
  </div>
</body>
</html>
